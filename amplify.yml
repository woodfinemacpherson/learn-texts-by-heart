version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 26
        - nvm use 26
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
